<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Animation Test</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222; /* Dark background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
            color: white;
        }
        canvas {
            display: block;
            background-color: #555; /* Canvas background */
            border: 1px solid #eee;
            image-rendering: pixelated; /* Keep pixel art sharp */
            image-rendering: crisp-edges;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.5);
            padding: 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

<div id="info">Frame: <span id="frame-index">0</span></div>
<canvas id="spriteCanvas"></canvas>

<script>
    const canvas = document.getElementById('spriteCanvas');
    const ctx = canvas.getContext('2d');
    const frameInfo = document.getElementById('frame-index');

    // --- Spritesheet Configuration ---
    const spriteSheetUrl = 'https://cdn.glitch.global/ce5fa771-596b-473d-9ba2-37a363571210/Idle.png?v=1744295959021';
    const frameWidth = 128; // Calculated: 1152 / 6
    const frameHeight = 128;
    const totalFrames = 6;
    const frameDelay = 99; // Milliseconds between frames (adjust for speed)
    // --- End Configuration ---

    // Scale the canvas slightly for visibility
    const scale = 5;
    canvas.width = frameWidth * scale;
    canvas.height = frameHeight * scale;

    const spriteSheet = new Image();
    spriteSheet.src = spriteSheetUrl;

    let currentFrame = 0;
    let lastFrameTime = 0;
    let imageLoaded = false;

    function animate(timestamp) {
        if (!imageLoaded) {
            requestAnimationFrame(animate); // Keep looping until loaded
            return;
        }

        const deltaTime = timestamp - lastFrameTime;

        // Clear the canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw the current frame
        const sourceX = currentFrame * frameWidth;
        const sourceY = 0; // Assuming single row spritesheet

        // Draw image scaled up
        ctx.drawImage(
            spriteSheet,
            sourceX, sourceY,           // Source x, y on spritesheet
            frameWidth, frameHeight,    // Source width, height (one frame)
            0, 0,                       // Destination x, y on canvas
            canvas.width, canvas.height // Destination width, height (scaled)
        );

        // Update frame only if enough time has passed
        if (deltaTime >= frameDelay) {
            lastFrameTime = timestamp; // More accurate: timestamp - (deltaTime % frameDelay);
            currentFrame = (currentFrame + 1) % totalFrames; // Loop animation
             if (frameInfo) frameInfo.textContent = currentFrame; // Update display
        }

        requestAnimationFrame(animate); // Continue the loop
    }

    spriteSheet.onload = () => {
        console.log("Spritesheet loaded successfully!");
        imageLoaded = true;
        lastFrameTime = performance.now(); // Get high-resolution timestamp
        animate(lastFrameTime); // Start the animation loop
    };

    spriteSheet.onerror = () => {
        console.error("Failed to load the spritesheet!");
        ctx.fillStyle = 'red';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("Error loading sprite!", canvas.width / 2, canvas.height / 2);
    };

</script>

</body>
</html>
