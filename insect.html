<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insect Attack Animation (Corrected Size)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
            color: blue;
        }
        h1 {
            margin-bottom: 20px;
        }
        canvas {
            display: circle;
            background-color: #0; /* Gray background */
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.5);
            padding: 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

<h1>Insect Attack (1024x1024 Frames)</h1>
<div id="info">Frame: <span id="frame-index">0</span></div>
<canvas id="spriteCanvas"></canvas>

<script>
    const canvas = document.getElementById('spriteCanvas');
    const ctx = canvas.getContext('2d');
    const frameInfo = document.getElementById('frame-index');

    // --- Spritesheet Configuration ---
    const spriteSheetUrl = 'https://cdn.glitch.global/ce5fa771-596b-473d-9ba2-37a363571210/insect_attack-removebg-preview.png?v=1744344578211';
    // *** UPDATED DIMENSIONS BASED ON 3072x1024 sheet with 3 frames ***
    const frameWidth = 288;   // 3072px wide / 3 frames = 1024px per frame
    const frameHeight = 400;  // Sheet height is 1024px
    const totalFrames = 3;     // There are 3 frames total
    const frameDelay = 150;    // Milliseconds between frames (adjust as needed)
    // --- End Configuration ---

    // Scale the canvas (optional, 1 = full size, 0.5 = half size)
    const scale = 0.5; // Display at 512x512
    canvas.width = frameWidth * scale;
    canvas.height = frameHeight * scale;
    ctx.imageSmoothingEnabled = false; // Keep pixels sharp if scaling down

    const spriteSheet = new Image();
    let currentFrame = 0;
    let lastFrameTime = 0;
    let imageLoaded = false;

    function animate(timestamp) {
        if (!imageLoaded) {
            requestAnimationFrame(animate); // Wait for load
            return;
        }

        // Initialize time on first frame
        if (lastFrameTime === 0) {
            lastFrameTime = timestamp;
        }

        const deltaTime = timestamp - lastFrameTime;

        // Update frame logic
        if (deltaTime >= frameDelay) {
            lastFrameTime = timestamp - (deltaTime % frameDelay); // Adjust for smoother timing
            currentFrame = (currentFrame + 1) % totalFrames; // Cycle through 0, 1, 2
            if (frameInfo) frameInfo.textContent = currentFrame;
        }

        // --- Drawing ---
        ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear previous frame

        // Calculate source position on the spritesheet (now using 1024 width)
        const sourceX = currentFrame * frameWidth; // Frame 0: 0, Frame 1: 1024, Frame 2: 2048
        const sourceY = 0; // Still assuming frames are on the first row

        try {
            // Draw the single 1024x1024 frame, scaled down to canvas size
            ctx.drawImage(
                spriteSheet,        // The loaded 3072x1024 image
                sourceX, sourceY,   // Source rect top-left (0,0 or 1024,0 or 2048,0)
                frameWidth, frameHeight, // Source rect size (1024x1024)
                0, 0,               // Destination top-left on canvas (0,0)
                canvas.width, canvas.height // Destination size on canvas (scaled, e.g., 512x512)
            );
        } catch (e) {
            console.error("Error during drawing:", e);
            // Potentially stop animation on error
            return;
        }

        requestAnimationFrame(animate); // Loop
    }

    spriteSheet.onload = () => {
        console.log(`Image loaded. Actual size: ${spriteSheet.naturalWidth}x${spriteSheet.naturalHeight}. Configured frame size: ${frameWidth}x${frameHeight}. Total frames: ${totalFrames}.`);
        // Check if calculated total width matches
        if (spriteSheet.naturalWidth !== frameWidth * totalFrames) {
             console.warn(`WIDTH MISMATCH WARNING: Image width (${spriteSheet.naturalWidth}) != frameWidth (${frameWidth}) * totalFrames (${totalFrames}) = ${frameWidth * totalFrames}`);
        }
        // Check height
        if (spriteSheet.naturalHeight !== frameHeight) {
             console.warn(`HEIGHT MISMATCH WARNING: Image height (${spriteSheet.naturalHeight}) != frameHeight (${frameHeight})`);
        }
        imageLoaded = true;
        lastFrameTime = 0; // Reset time for first animation frame
        requestAnimationFrame(animate);
    };

    spriteSheet.onerror = (err) => {
        console.error("Failed to load the spritesheet:", err);
        ctx.fillStyle = 'red';
        ctx.font = '16px sans-serif'; // Use fixed size font for error
        ctx.textAlign = 'center';
        // Adjust text position based on potentially scaled canvas
        ctx.fillText("Error loading sprite!", canvas.width / 2, canvas.height / 2);
    };

    // Start loading
    console.log("Requesting image:", spriteSheetUrl);
    spriteSheet.src = spriteSheetUrl;

</script>

</body>
</html>
